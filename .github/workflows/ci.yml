name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run tests
        run: |
          pytest -q
      - name: Run batch evaluation
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python inference_custom.py --batch test_data --csv batch_results.csv
      - name: Upload evaluation artifact
        uses: actions/upload-artifact@v4
        with:
          name: batch-results
          path: batch_results.csv
