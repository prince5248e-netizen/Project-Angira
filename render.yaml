services:
  - type: web
    name: voice-authenticity-checker
    runtime: python
    plan: starter
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: gunicorn --workers 1 --threads 2 --timeout 180 --bind 0.0.0.0:$PORT app:app
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: "3.13.2"
      - key: HF_HOME
        value: /opt/render/project/.cache/huggingface
